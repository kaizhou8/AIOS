<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOS-CSharp MAF 实时演示</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .agent-card { transition: all 0.3s ease; border-left: 4px solid #3b82f6; }
        .agent-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .task-running { animation: pulse 2s infinite; border-left-color: #10b981; }
        .task-completed { border-left-color: #10b981; }
        .task-failed { border-left-color: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .metric-value { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- 头部 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">AIOS-CSharp MAF 实时演示</h1>
            <p class="text-gray-600">Microsoft Agent Framework 集成效果展示</p>
            <div class="mt-4 space-x-4">
                <button onclick="startDemo()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">开始演示</button>
                <button onclick="stopDemo()" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">停止演示</button>
                <button onclick="resetDemo()" class="px-6 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">重置</button>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">系统状态</p>
                        <p id="systemStatus" class="text-2xl font-bold text-green-600">就绪</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">活跃代理</p>
                        <p id="activeAgents" class="text-2xl font-bold metric-value">3</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">处理任务</p>
                        <p id="processedTasks" class="text-2xl font-bold metric-value">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">平均响应</p>
                        <p id="avgResponseTime" class="text-2xl font-bold metric-value">0ms</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 代理卡片 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- LLM代理 -->
            <div id="llmAgent" class="agent-card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">LLM通用代理</h3>
                    <span id="llmStatus" class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">就绪</span>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span>处理任务:</span>
                        <span id="llmTasks" class="font-medium">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>平均响应:</span>
                        <span id="llmResponse" class="font-medium">0ms</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>成功率:</span>
                        <span id="llmSuccess" class="font-medium text-green-600">100%</span>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="llmProgress" class="bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 代码生成代理 -->
            <div id="codeAgent" class="agent-card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">代码生成代理</h3>
                    <span id="codeStatus" class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">就绪</span>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span>处理任务:</span>
                        <span id="codeTasks" class="font-medium">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>平均响应:</span>
                        <span id="codeResponse" class="font-medium">0ms</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>成功率:</span>
                        <span id="codeSuccess" class="font-medium text-green-600">100%</span>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="codeProgress" class="bg-green-600 h-2 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 数据分析代理 -->
            <div id="dataAgent" class="agent-card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">数据分析代理</h3>
                    <span id="dataStatus" class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">就绪</span>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span>处理任务:</span>
                        <span id="dataTasks" class="font-medium">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>平均响应:</span>
                        <span id="dataResponse" class="font-medium">0ms</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>成功率:</span>
                        <span id="dataSuccess" class="font-medium text-green-600">100%</span>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="dataProgress" class="bg-purple-600 h-2 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时任务日志 -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900">实时任务日志</h3>
            </div>
            <div class="p-6">
                <div id="taskLog" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- 动态填充任务日志 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let demoRunning = false;
        let taskCount = 0;
        let agents = {
            llm: { tasks: 0, response: 0, success: 0 },
            code: { tasks: 0, response: 0, success: 0 },
            data: { tasks: 0, response: 0, success: 0 }
        };

        function addLog(message, type = 'info') {
            const log = document.getElementById('taskLog');
            const div = document.createElement('div');
            div.className = `text-sm p-2 rounded ${type === 'success' ? 'bg-green-50 text-green-800' : 
                type === 'error' ? 'bg-red-50 text-red-800' : 'bg-gray-50 text-gray-800'}`;
            div.innerHTML = `<span class="font-mono text-xs">${new Date().toLocaleTimeString()}</span> ${message}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function updateMetrics() {
            document.getElementById('processedTasks').textContent = taskCount;
            document.getElementById('activeAgents').textContent = 3;
            
            const avgResponse = Math.round((agents.llm.response + agents.code.response + agents.data.response) / 3);
            document.getElementById('avgResponseTime').textContent = avgResponse + 'ms';
        }

        function simulateTask(agentType, taskName) {
            const agent = document.getElementById(agentType + 'Agent');
            const status = document.getElementById(agentType + 'Status');
            const tasks = document.getElementById(agentType + 'Tasks');
            const response = document.getElementById(agentType + 'Response');
            const progress = document.getElementById(agentType + 'Progress');

            agent.classList.add('task-running');
            status.textContent = '运行中';
            status.className = 'px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs';

            addLog(`${agentType.toUpperCase()}代理开始任务: ${taskName}`, 'info');

            const startTime = Date.now();
            const duration = Math.random() * 2000 + 500; // 500-2500ms

            let progressWidth = 0;
            const interval = setInterval(() => {
                progressWidth += 2;
                progress.style.width = progressWidth + '%';
                
                if (progressWidth >= 100) {
                    clearInterval(interval);
                    
                    const endTime = Date.now();
                    const responseTime = endTime - startTime;
                    
                    agents[agentType].tasks++;
                    agents[agentType].response = responseTime;
                    agents[agentType].success++;
                    
                    tasks.textContent = agents[agentType].tasks;
                    response.textContent = responseTime + 'ms';
                    
                    agent.classList.remove('task-running');
                    agent.classList.add('task-completed');
                    status.textContent = '就绪';
                    status.className = 'px-2 py-1 bg-green-100 text-green-800 rounded text-xs';
                    
                    addLog(`${agentType.toUpperCase()}代理完成任务: ${taskName} (${responseTime}ms)`, 'success');
                    
                    setTimeout(() => {
                        agent.classList.remove('task-completed');
                        progress.style.width = '0%';
                    }, 2000);
                    
                    taskCount++;
                    updateMetrics();
                }
            }, duration / 50);
        }

        function startDemo() {
            if (demoRunning) return;
            demoRunning = true;
            
            document.getElementById('systemStatus').textContent = '运行中';
            document.getElementById('systemStatus').className = 'text-2xl font-bold text-blue-600';
            
            addLog('🚀 AIOS-CSharp MAF 演示开始', 'info');
            addLog('📊 系统初始化完成，3个代理已就绪', 'info');

            const tasks = [
                { agent: 'llm', name: '生成Python函数' },
                { agent: 'code', name: '创建用户模型类' },
                { agent: 'data', name: '分析销售数据' },
                { agent: 'llm', name: '解释机器学习概念' },
                { agent: 'code', name: '生成API接口' },
                { agent: 'data', name: '趋势预测分析' }
            ];

            let taskIndex = 0;
            const runNextTask = () => {
                if (taskIndex < tasks.length && demoRunning) {
                    simulateTask(tasks[taskIndex].agent, tasks[taskIndex].name);
                    taskIndex++;
                    setTimeout(runNextTask, 3000 + Math.random() * 2000);
                } else if (taskIndex >= tasks.length) {
                    addLog('✅ 演示完成！所有任务执行完毕', 'success');
                }
            };
            
            runNextTask();
        }

        function stopDemo() {
            demoRunning = false;
            document.getElementById('systemStatus').textContent = '已停止';
            document.getElementById('systemStatus').className = 'text-2xl font-bold text-red-600';
            addLog('⏹️ 演示已停止', 'info');
        }

        function resetDemo() {
            stopDemo();
            taskCount = 0;
            agents = { llm: { tasks: 0, response: 0, success: 0 }, code: { tasks: 0, response: 0, success: 0 }, data: { tasks: 0, response: 0, success: 0 } };
            
            // 重置所有显示
            document.getElementById('systemStatus').textContent = '就绪';
            document.getElementById('systemStatus').className = 'text-2xl font-bold text-green-600';
            document.getElementById('processedTasks').textContent = '0';
            document.getElementById('avgResponseTime').textContent = '0ms';
            
            ['llm', 'code', 'data'].forEach(type => {
                document.getElementById(type + 'Tasks').textContent = '0';
                document.getElementById(type + 'Response').textContent = '0ms';
                document.getElementById(type + 'Progress').style.width = '0%';
            });
            
            document.getElementById('taskLog').innerHTML = '';
            addLog('🔄 系统已重置', 'info');
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            addLog('🎯 AIOS-CSharp MAF 演示系统已加载', 'info');
            addLog('📋 3个智能代理已就绪：LLM通用代理、代码生成代理、数据分析代理', 'info');
            addLog('🔧 点击"开始演示"按钮查看MAF集成效果', 'info');
        });
    </script>
</body>
</html>
